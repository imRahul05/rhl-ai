name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  validate:
    name: Build, Lint, Typecheck & Test
    runs-on: ubuntu-latest
    if: github.repository_owner == 'imRahul05'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  release:
    name: Release Packages
    needs: validate
    runs-on: ubuntu-latest
    if: github.repository_owner == 'imRahul05'

    permissions:
      contents: write
      pull-requests: write
      id-token: write # npm trusted publishing (OIDC) + provenance

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          # No registry-url: it makes setup-node write an .npmrc with
          # `_authToken=${NODE_AUTH_TOKEN}`, and npm falls back to that token
          # whenever the OIDC exchange fails (-> EOTP). npmjs.org is the default.

      # Trusted publishing requires npm >= 11.5.1. Pinned for reproducible releases.
      - name: Install npm for trusted publishing
        run: npm install -g npm@11.21.3

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Writes .changeset/auto-*.md for packages with unreleased changes. The files
      # stay uncommitted on purpose: changesets/action resets its release branch to
      # this push's sha, and untracked files survive that reset, so they land in the
      # "Version Packages" PR. The script recomputes from each package's last version
      # bump on every run, so nothing needs to be persisted on main.
      - name: Generate automatic changesets
        run: node scripts/auto-changeset.mjs

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          # release:ci = pre-flight auth check (scripts/check-publish-auth.mjs) + pnpm release
          publish: pnpm release:ci
          title: 'chore: version and publish packages'
          commit: 'chore: version and publish packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          # Intentionally no NPM_TOKEN / NODE_AUTH_TOKEN: publishing uses npm Trusted
          # Publishing (OIDC via `id-token: write`) only.
